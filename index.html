<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

<title>Gesch&uuml;tzter Bereich</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #0d1117; color: #e6edf3;
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 34rem; background: #161b22; border: 1px solid #30363d;
    border-radius: 14px; padding: 2rem 1.75rem; box-shadow: 0 12px 40px rgb(0 0 0 / .45);
  }
  .lock { font-size: 2rem; line-height: 1; }
  h1 { margin: .75rem 0 .35rem; font-size: 1.35rem; letter-spacing: -.01em; }
  p.sub { margin: 0 0 1.25rem; color: #8b949e; font-size: .9rem; }
  #msg { min-height: 1.3rem; margin: .9rem 0 0; font-size: .875rem; color: #8b949e; }
  #msg[data-state=error] { color: #f85149; }
  footer { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #21262d; color: #6e7681; font-size: .75rem; }
  #app { width: 100%; max-width: 46rem; }
  #app h1 { font-size: 1.6rem; }
  #app a { color: #2f81f7; }
  #app code { background: #21262d; padding: .1em .35em; border-radius: 4px; font-size: .9em; }
</style>
</head>
<body>
<section class="card" id="gate">
  <div class="lock" aria-hidden="true">&#128274;</div>
  <h1>Gesch&uuml;tzter Bereich</h1>
  <p class="sub">Dieser Inhalt ist verschl&uuml;sselt und &ouml;ffnet sich nur &uuml;ber den QR-Code. Es gibt kein Passwort und kein Eingabefeld &ndash; der Schl&uuml;ssel steckt im Code selbst.</p>
  <p id="msg" role="status" aria-live="polite">Bitte den QR-Code scannen.</p>
  <footer>Ohne Schl&uuml;ssel steht in dieser Seite nur Ciphertext.</footer>
</section>
<main id="app" hidden></main>
<noscript><p style="color:#f85149">JavaScript wird ben&ouml;tigt, um diese Seite zu entschl&uuml;sseln.</p></noscript>

<script>
(function () {
  var data = JSON.parse(document.getElementById('p').textContent);
  var enc = new TextEncoder(), dec = new TextDecoder();
  var gate = document.getElementById('gate');
  var app = document.getElementById('app');
  var msg = document.getElementById('msg');
  var busy = false;

  function b64u(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function setMsg(text, state) {
    msg.textContent = text;
    msg.dataset.state = state || 'info';
  }

  async function unlock(token) {
    if (busy) return;
    if (!/^[A-Za-z0-9_-]{43}$/.test(token)) {
      setMsg('Der Link ist unvollständig. Bitte den QR-Code erneut scannen.', 'error');
      return;
    }
    busy = true;
    setMsg('Entschlüssele …', 'info');
    try {
      var ikm = await crypto.subtle.importKey('raw', b64u(token), 'HKDF', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        { name: 'HKDF', hash: 'SHA-256', salt: b64u(data.salt), info: enc.encode(data.info) },
        ikm, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u(data.iv) }, key, b64u(data.ct));
      app.innerHTML = dec.decode(plain);
      gate.remove();
      app.hidden = false;
    } catch (err) {
      busy = false;
      setMsg('Dieser Code passt nicht zu dieser Seite. Bitte den aktuellen QR-Code scannen.', 'error');
    }
  }

  function tryHash() {
    if (!gate.isConnected) return;
    var token = new URLSearchParams(location.hash.slice(1)).get('k');
    if (token) {
      unlock(token);
    } else if (location.hash) {
      setMsg('Dem Link fehlt der Schlüssel (der Teil nach #). Manche Scanner-Apps schneiden ihn ab – bitte mit einer anderen App scannen.', 'error');
    }
  }
  window.addEventListener('hashchange', function () { busy = false; tryHash(); });
  window.addEventListener('pageshow', function () { busy = false; tryHash(); });
  tryHash();
})();
</script>
</body>
